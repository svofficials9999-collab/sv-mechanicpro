<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#05081c;color:#e8f1ff;font-family:system-ui,-apple-system,"Noto Sans Telugu","Nirmala UI",Roboto,sans-serif;font-size:16px;line-height:1.55}
body{background:radial-gradient(circle at 15% 0,#1b2a63 0,#070b24 55%,#05081c 100%) fixed;min-height:100vh;padding-bottom:70px}
.w{max-width:520px;margin:0 auto;padding:12px 14px}
h1,h2,h3{margin:.3em 0;line-height:1.25}
.neon{background:linear-gradient(90deg,#00e5ff,#ff4df0,#ffd600,#00e5ff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:sh 6s linear infinite}
@keyframes sh{to{background-position:300% 0}}
.top{display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:5;padding:8px 10px;background:#070b24ee;backdrop-filter:blur(8px);border-bottom:1px solid #2b3a7a}
.top .t{flex:1;font-weight:800;font-size:17px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ib{border:1.5px solid #4a5aa8;background:#101a45;color:#fff;border-radius:12px;min-width:40px;height:40px;font-size:15px;font-weight:700;padding:0 10px;box-shadow:0 0 10px #00e5ff33}
.ib:active,.btn:active,.card:active,.on{background:#0a1030!important;box-shadow:inset 0 0 12px #000a,0 0 6px #ff4df088;transform:scale(.97)}
.card{display:block;width:100%;text-align:left;border:1.5px solid #3a4a98;background:linear-gradient(145deg,#111b4acc,#0a1030cc);color:#fff;border-radius:16px;padding:11px 12px;margin:8px 0;font:inherit;box-shadow:0 0 12px #7c4dff33}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid .card{margin:0;min-height:84px;display:flex;flex-direction:column;justify-content:center}
.card b{display:block}.card small{color:#9fb4e8}
.btn{border:1.5px solid #00e5ffaa;background:linear-gradient(135deg,#0b2a66,#2b126e);color:#fff;border-radius:14px;padding:10px 14px;font:inherit;font-weight:700;box-shadow:0 0 12px #00e5ff44;margin:4px 4px 4px 0}
.btn.g{border-color:#ffd600aa}.btn.r{border-color:#ff4df0aa}
img.hero{width:100%;border-radius:14px;border:1.5px solid #3a4a98;margin:6px 0;display:block;background:#0a1030}
.cap{font-size:12px;color:#8ea2d8;margin:-2px 0 8px}
.step{display:flex;gap:10px;margin:10px 0;padding:10px;border-radius:14px;background:#0d1540aa;border:1px solid #2b3a7a}
.step i{flex:0 0 30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#00e5ff,#ff4df0);color:#001;font-style:normal;font-weight:900;display:flex;align-items:center;justify-content:center}
.warn{border:1.5px solid #ffb300;background:#3a2a0088;border-radius:14px;padding:10px;margin:10px 0}
.q{border:1px solid #3a4a98;border-radius:14px;padding:10px;margin:10px 0;background:#0d1540aa}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px;border-radius:12px;border:1.5px solid #4a5aa8;background:#101a45;color:#fff;font:inherit}
.opt.ok{border-color:#30d158;background:#0a3a1f}.opt.bad{border-color:#ff453a;background:#3a0f10}
.exp{font-size:14px;color:#cfe0ff;margin-top:4px}
input[type=text],textarea{width:100%;border-radius:14px;border:1.5px solid #7c4dffcc;background:#0f1633;color:#fff;font:inherit;font-size:17px;padding:11px;outline:none}
.me{width:64px;height:64px;border-radius:50%;border:3px solid transparent;background:linear-gradient(#05081c,#05081c) padding-box,linear-gradient(135deg,#00e5ff,#ff4df0,#ffd600) border-box;box-shadow:0 0 16px #ff4df0aa;object-fit:cover;object-position:50% 25%}
.cr{display:flex;align-items:center;gap:12px;margin:14px 0;padding:10px;border-radius:16px;border:1px solid #2b3a7a;background:#0d1540aa}
.pb{height:8px;border-radius:6px;background:#1a2560;overflow:hidden;margin:6px 0}.pb i{display:block;height:100%;background:linear-gradient(90deg,#00e5ff,#ff4df0)}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;background:#070b24f5;border-top:1px solid #2b3a7a;padding-bottom:env(safe-area-inset-bottom,0)}
.tabs button{flex:1;border:0;background:none;color:#9fb4e8;font:inherit;font-size:12px;padding:8px 2px;font-weight:700}
.tabs button.on{color:#fff;background:#0a1030;border-top:2px solid #00e5ff;box-shadow:none;transform:none}
.tabs span{display:block;font-size:20px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;border:1px solid #4a5aa8;color:#9fb4e8;margin-right:4px}
.done{color:#30d158}
.lk{color:#7fe9ff}
</style></head>

back:['వెనక్కి','Back'],listen:['🔊 వినండి','🔊 Listen'],stop:['⏹ ఆపండి','⏹ Stop'],quiz:['క్విజ్ రాయండి','Take the quiz'],next:['తర్వాతి పాఠం ▶','Next lesson ▶'],
tit:['SV మెకానిక్‌ప్రో','SV MechanicPro'],sub:['బైక్ మరియు కార్ మెకానిక్ నేర్చుకోండి - ఉచితం','Learn bike and car mechanic skills - free'],
lvl:['లెవెల్ 1 - బిగినర్ (బైక్)','Level 1 - Beginner (Bike)'],car:['కార్ కోర్సు (త్వరలో)','Car course (coming soon)'],

hi:['నమస్తే','Hello'],free:['ఉచితం, సైన్-ఇన్ అవసరం లేదు, ఆఫ్‌లైన్‌లో పనిచేస్తుంది','Free, no sign-in, works offline'],

car2:['కార్ మెకానిక్ కోర్సు తర్వాతి దశల్లో వస్తుంది. ముందు బైక్ లెవెల్ 1 నేర్చుకోండి.','The car mechanic course comes in later phases. Learn bike Level 1 first.'],
share:['🔗 షేర్','🔗 Share'],ins:['వాయిస్ ఆడియో లేకపోతే ఫోన్ వాయిస్ వాడుతుంది.','If a recorded voice is missing, your phone voice is used.']};

function L(a){return a[S.lang==='te'?0:1]}

var cur=null,aud=null;
function stopSpeak(){try{speechSynthesis.cancel()}catch(e){}if(aud){aud.pause();aud=null}cur=null;var b=$('#lbtn');if(b)b.innerHTML=t('listen')}
function pickVoice(lang){var vs=speechSynthesis.getVoices()||[],pre=lang==='te'?'te':'en';var c=vs.filter(function(v){return v.lang.toLowerCase().indexOf(pre)===0});if(lang==='en'){var inn=c.filter(function(v){return /IN/i.test(v.lang)});if(inn.length)c=inn}
if(S.fem){var f=c.filter(function(v){return /female|woman|heera|neerja|swara|lekha|veena|shruti|kalpana|google/i.test(v.name)});if(f.length)c=f}return c[0]||null}

function head(title,back){return '<div class="top">'+(back?'<button class="ib" onclick="history.back()" aria-label="back">◀</button>':'<img src="icon.svg" width="36" height="36" alt="">')+'<div class="t neon">'+esc(title)+'</div><button class="ib" onclick="MP.lang()">'+(S.lang==='te'?'EN':'తె')+'</button></div>'}

function norm(s){return String(s||'').toLowerCase().replace(/[^a-z0-9\u0c00-\u0c7f ]+/g,' ').replace(/\s+/g,' ').trim()}
function doSearch(q){q=norm(q);if(!q)return[];var w=q.split(' ').filter(function(x){return x.length>1});var res=[];PROB.forEach(function(p){var k=norm(p.k+' '+L(p.t)+' '+p.t[0]+' '+p.t[1]),sc=0;if(k.indexOf(q)>=0)sc+=5;w.forEach(function(x){if(k.indexOf(x)>=0)sc+=1;else if(x.length>3&&k.indexOf(x.slice(0,x.length-1))>=0)sc+=.6});if(sc>0)res.push([sc,p])});res.sort(function(a,b){return b[0]-a[0]});return res.slice(0,5).map(function(x){return x[1]})}
